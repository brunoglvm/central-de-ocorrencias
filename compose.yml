services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "setup/scripts/minio-init.sh"]
    volumes:
      - ./setup:/setup

  backend:
    build:
      context: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    environment: # Replace the localhost values with your public domains in prod
      CORS_ORIGIN: http://localhost:8080
      MINIO_ENDPOINT: minio # Compose service name, same in prod
      MINIO_PUBLIC_URL: http://localhost:9000
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/src/database:/app/src/database
    depends_on:
      - minio

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - backend

  nginx:
    image: nginx:1.30.4-alpine3.24
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  minio_data:
